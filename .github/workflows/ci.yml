name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una sola run per branch o PR: un push nuovo cancella quella vecchia,
# così i pochi runner macOS del piano free non smaltiscono run superate.
# Su main la run in corso finisce sempre: i push arrivati nel frattempo
# restano in una sola run in attesa, la più recente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit:
    needs: list
    if: needs.list.outputs.kit == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - &checkout
        uses: actions/checkout@v4

      - &xcode
        name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version

      - &simulator
        name: Pick a simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          print(next(d["udid"] for d in reversed(devices) if d["name"].startswith("iPhone")))')
          echo "DESTINATION=id=$id" >> "$GITHUB_ENV"

      - name: Tokens match Design/tokens.json
        run: python3 Tools/sync_tokens.py && git diff --exit-code

      - name: SbuKit
        working-directory: Packages/SbuKit
        run: xcodebuild test -scheme SbuKit -destination "$DESTINATION"

      - name: SbuKit (macOS)
        working-directory: Packages/SbuKit
        run: xcodebuild test -scheme SbuKit -destination platform=macOS

  # On main every Apps/Sbu* folder, so a new app is tested without touching this file.
  # In a PR only the apps it changes, plus SbuKit when Packages/, Design/, Tools/ or CI change:
  # the org has 5 macOS runners, and main still tests every app against the new SbuKit.
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
      kit: ${{ steps.apps.outputs.kit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: apps
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # HEAD is the merge commit: its first parent is the base branch.
            changed=$(git diff --name-only HEAD^1 HEAD)
            apps=$(echo "$changed" | sed -n 's|^Apps/\(Sbu[^/]*\)/.*|\1|p' | sort -u | while read -r a; do if [ -d "Apps/$a" ]; then echo "$a"; fi; done)
            grep -qE '^(Packages|Design|Tools|\.github)/' <<< "$changed" && kit=true || kit=false
          else
            apps=$(ls -d Apps/Sbu* | xargs -n1 basename)
            kit=true
          fi
          echo "apps=$(echo "$apps" | jq -R . | jq -sc 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "kit=$kit" >> "$GITHUB_OUTPUT"
          echo "apps: $apps / kit: $kit"

  app:
    needs: list
    if: needs.list.outputs.apps != '[]'
    runs-on: macos-26
    # SbuHabits' UI tests alone take 40 to 46 minutes on the runner (SBU-376).
    timeout-minutes: ${{ matrix.app == 'SbuHabits' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    name: ${{ matrix.app }}
    defaults:
      run:
        working-directory: Apps/${{ matrix.app }}
    steps:
      - *checkout
      - *xcode
      - *simulator
      - name: Test
        run: |
          brew install xcodegen
          xcodegen generate
          # Le app macOS (Sbu Seasons) non girano sul simulatore iPhone.
          grep -q 'platform: macOS' project.yml && DESTINATION=platform=macOS
          xcodebuild test -project ${{ matrix.app }}.xcodeproj -scheme ${{ matrix.app }} -destination "$DESTINATION"
