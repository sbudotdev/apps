name: SbuSeasons
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    macOS: "14.0"
  # Le altre lingue (en, de, fr, es, ja, pt, nl) le trova XcodeGen nei .xcstrings e le mette in knownRegions (SBU-199).
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.3.0"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SbuSeasons:
    type: application
    platform: macOS
    sources:
      - SbuSeasons
      # Fonts and licences straight from Design/fonts, the same files SbuKit and the site ship.
      - path: ../../Design/fonts
        buildPhase: resources
    # Il file .sbuseasons (SBU-200): un pupazzo, un albero o una decorazione da mandare. Il tipo è nostro (esportato);
    # aprendo il file, l'oggetto arriva sullo schermo (`AppDelegate.application(_:open:)`). Le chiavi generate restano.
    info:
      path: Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.sbu.seasons.toy
            UTTypeDescription: Oggetto di Sbu Seasons
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [sbuseasons]
              public.mime-type: [application/x-sbuseasons]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Oggetto di Sbu Seasons
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.sbu.seasons.toy]
    dependencies:
      # Il salvaschermo viaggia dentro l'app, in Contents/Resources: "Installa il salvaschermo" lo copia (SBU-179).
      - target: SbuSeasonsSaver
        embed: true
        copy:
          destination: resources
    settings:
      base:
        # Name chosen by Matteo on 15/11 (MGS-415): more seasons and themes may come after the snow.
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.SbuSeasons
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Seasons
        # Icon from Tools/make_icons.py seasons --mac-appiconset (MGS-614).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        # Menu bar only: no Dock icon until the settings window opens.
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc signing when SBU_TEAM_ID is not set, as build-app.sh did.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # No sandbox: CGWindowListCopyWindowInfo and the Accessibility API need it off (ADR-0022).
        ENABLE_APP_SANDBOX: NO
  # Il salvaschermo (SBU-179): lo stesso codice dell'app (sfondi, momenti, SeasonScene) senza AppDelegate,
  # più SaverBundle/ con la ScreenSaverView. Gira dentro legacyScreenSaver di macOS: niente impostazioni dell'app.
  SbuSeasonsSaver:
    type: bundle
    platform: macOS
    sources:
      - path: SbuSeasons
        excludes: [App.swift, AppDelegate.swift, "Sounds/**"]
      - SaverBundle
    settings:
      base:
        PRODUCT_NAME: Sbu Seasons
        PRODUCT_MODULE_NAME: SbuSeasonsSaver
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.SbuSeasons.Saver
        WRAPPER_EXTENSION: saver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: SbuSeasonsSaverView
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Seasons
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  SbuSeasonsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SbuSeasonsTests]
    dependencies:
      - target: SbuSeasons
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SbuSeasons.app/Contents/MacOS/SbuSeasons
schemes:
  SbuSeasons:
    build:
      targets:
        SbuSeasons: all
    test:
      targets: [SbuSeasonsTests]
