name: SbuPrompter
options:
  bundleIdPrefix: dev.sbu
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
packages:
  SbuKit:
    path: ../../Packages/SbuKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(SBU_TEAM_ID)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
# The iPhone remote (SbuPrompterRemote, iOS 17) has the same bundle id for universal purchase
# (spec SBU-166) and compiles SbuPrompter/Core as shared sources, so Core stays pure Swift with no AppKit.
# Mac and iPhone talk only over MultipeerConnectivity on the local network (ADR-0007).
targets:
  SbuPrompter:
    type: application
    platform: macOS
    sources: [SbuPrompter]
    dependencies:
      - package: SbuKit
    entitlements:
      path: SbuPrompter/SbuPrompter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Microphone for the voice scrolling; nothing else leaves the sandbox.
        com.apple.security.device.audio-input: true
        # Import of .txt, .md and .rtf the user picks.
        com.apple.security.files.user-selected.read-only: true
        # MultipeerConnectivity for the iPhone remote, on the local network only.
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    info:
      path: SbuPrompter/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_sbu-prompter._tcp, _sbu-prompter._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.prompter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Prompter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sbu Prompter ascolta la tua voce per far scorrere il copione mentre leggi. L'audio resta sul Mac."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Sbu Prompter riconosce le parole sul Mac, senza rete, per seguire il punto del copione che stai leggendo."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Sbu Prompter si fa trovare dal tuo iPhone sulla Wi-Fi, per usarlo come telecomando. Nulla esce dalla rete di casa."
        # Menu bar app: no Dock icon until the library window opens.
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuPrompterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SbuPrompterTests]
    dependencies:
      - target: SbuPrompter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SbuPrompter.app/Contents/MacOS/SbuPrompter
  SbuPrompterRemote:
    type: application
    platform: iOS
    sources:
      - SbuPrompterRemote
      - SbuPrompter/Core
    dependencies:
      - package: SbuKit
    info:
      path: SbuPrompterRemote/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_sbu-prompter._tcp, _sbu-prompter._udp]
    settings:
      base:
        # Same as the Mac app: one App Store record, universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: dev.sbu.prompter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sbu Prompter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ADR-0007. English in InfoPlist.xcstrings.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Sbu Prompter cerca il tuo Mac sulla Wi-Fi e gli manda i comandi che dai. Nulla esce dalla rete di casa."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # XcodeGen's target default is iPhone and iPad, which beats the project setting.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  SbuPrompterRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SbuPrompterRemoteTests]
    dependencies:
      - target: SbuPrompterRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SbuPrompterRemote.app/SbuPrompterRemote
  SbuPrompterRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SbuPrompterRemoteUITests]
    dependencies:
      - target: SbuPrompterRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: SbuPrompterRemote
        # XCTestCase's initializers are nonisolated; the test methods are @MainActor themselves.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  SbuPrompter:
    build:
      targets:
        SbuPrompter: all
    test:
      targets: [SbuPrompterTests]
  SbuPrompterRemote:
    build:
      targets:
        SbuPrompterRemote: all
    test:
      targets: [SbuPrompterRemoteTests, SbuPrompterRemoteUITests]
